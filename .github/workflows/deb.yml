name: deb

# The VitruvianOS .debs, amd64 and arm64, each built natively in a Debian trixie container
# (VitruvianOS 0.6's userland, glibc 2.41) on GitHub's ubuntu-24.04 / ubuntu-24.04-arm
# runners. The link-time V\OS SDK is built from tools/vos-sdk/ and cached per architecture.
# Run it by hand before a release (gh workflow run deb.yml --ref <branch>) and test that
# artifact; on a v* tag it attaches the .debs to the release only if none are attached yet.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  deb:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: debian:trixie
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          # VitruvianOS's own build deps (its ccpp-arm64.yml), minus image tooling and the
          # kits the link-only patch leaves out; plus packaging tools.
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git curl file python3 attr dpkg-dev gh \
            cmake ninja-build build-essential bison flex libfl-dev m4 pkg-config \
            zlib1g-dev libicu-dev libfreetype6-dev libpng-dev libjpeg-dev libgif-dev \
            libtiff-dev libwebp-dev libicns-dev libopenexr-dev libdrm-dev libinput-dev \
            libevdev-dev libseat-dev libelf-dev libncurses-dev libpam0g-dev libglib2.0-dev \
            libudev-dev libsystemd-dev libblkid-dev libxkbcommon-dev

      - uses: actions/checkout@v4

      - name: App settings
        id: app
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . ./haiku-app.env
          echo "cmd=$APP_CMD" >> "$GITHUB_OUTPUT"
          EXTRA="${DEB_APT_EXTRA:-$APPIMAGE_APT_EXTRA}"
          if [ -n "$EXTRA" ]; then DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends $EXTRA; fi

      - name: Cache V\OS SDK
        uses: actions/cache@v4
        with:
          path: /opt/vos-sdk
          key: vos-sdk-0.6.2-${{ matrix.arch }}-${{ hashFiles('tools/vos-sdk/*') }}-debian-trixie

      - name: Build V\OS SDK
        run: |
          [ -f /opt/vos-sdk/sdk/env.sh ] || sh tools/vos-sdk/make-sdk.sh /opt/vos-sdk

      - name: Build .deb
        run: |
          . /opt/vos-sdk/sdk/env.sh
          sh packaging/build-deb.sh
          ls -l ${{ steps.app.outputs.cmd }}_*_${{ matrix.arch }}.deb
          dpkg-deb -I ${{ steps.app.outputs.cmd }}_*_${{ matrix.arch }}.deb
          file obj/deb/*/system/apps/*
          echo "glibc needed: $(objdump -T obj/deb/*/system/apps/* | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -1)"

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: ${{ steps.app.outputs.cmd }}_*_${{ matrix.arch }}.deb

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DEB=$(ls ${{ steps.app.outputs.cmd }}_*_${{ matrix.arch }}.deb)
          if gh release view "${GITHUB_REF_NAME}" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx "$DEB"; then
            echo "Release already has $DEB; leaving it."
          else
            gh release upload "${GITHUB_REF_NAME}" "$DEB" -R "$GITHUB_REPOSITORY"
          fi
